[project]
name = "robo-rec"
version = "0.1.0"
description = "Windows desktop GUI for BIP39 seed phrase recovery, wrapping btcrecover."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyside6>=6.7",
    "bip-utils>=2.9",
    "pycryptodome~=3.23.0",
    "protobuf~=5.29.6",
    "coincurve==20.0.0; python_version < '3.13'",
    "coincurve==21.0.0; python_version >= '3.13'",
    "py-crypto-hd-wallet>=1.3.3",
    "numpy>=2.4.6",
    "pyopencl>=2026.1.4",
    # Not a runtime import of robo_rec itself (never bundled into the compiled app — none
    # of compile.ps1/.sh/.bat/build.py pass --include-package=nuitka), but every one of
    # those build scripts shells out to `python -m nuitka` unconditionally, so it's
    # required in every dev environment that will ever run a build, not just an optional
    # "build" extra. Previously lived in [dependency-groups].build, which only gets
    # installed by `uv sync --group build` — a plain `pip install -e .` (this project's
    # actual setup, no uv present) silently skipped it, so the first `compile.ps1` run in
    # a fresh venv always failed with "No module named nuitka".
    "nuitka>=2.4",
]

[project.optional-dependencies]
cuda = [
    "pycuda>=2026.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robo_rec"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["vendor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end recovery runs that take more than a few seconds (excluded by default)",
]
addopts = "-m 'not slow'"
