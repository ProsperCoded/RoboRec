[project]
name = "robo-rec"
version = "0.1.0"
description = "Windows desktop GUI for BIP39 seed phrase recovery, wrapping btcrecover."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyside6>=6.7",
    "bip-utils>=2.9",
    "pycryptodome~=3.23.0",
    "protobuf~=5.29.6",
    "coincurve==20.0.0; python_version < '3.13'",
    "coincurve==21.0.0; python_version >= '3.13'",
    "py-crypto-hd-wallet>=1.3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]
build = [
    "nuitka>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robo_rec"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["vendor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
